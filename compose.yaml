services:
  app:
    build:
      context: .
      args:
        APP_BIN: rust_api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: marketplace
      REDIS_URL: redis://redis:6379/
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongo_data: